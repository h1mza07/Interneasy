<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InternEasy - Inscription</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">InternEasy</a>
        </div>
    </nav>

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card">
                    <div class="card-header">
                        <h3 class="mb-0">Créer votre compte</h3>
                    </div>
                    <div class="card-body p-4">
                        <div class="row mb-4">
                            <div class="col-md-6">
                                <div class="user-type-btn active text-center p-4" id="typeStudent">
                                    <div class="mb-3">🎓</div>
                                    <h4>Je suis étudiant</h4>
                                    <p class="text-muted mb-0">Je cherche un stage</p>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="user-type-btn text-center p-4" id="typeCompany">
                                    <div class="mb-3">🏢</div>
                                    <h4>Je suis une entreprise</h4>
                                    <p class="text-muted mb-0">Je propose des stages</p>
                                </div>
                            </div>
                        </div>

                        <form id="registerForm">
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Prénom *</label>
                                    <input type="text" class="form-control" required name="firstname">
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Nom *</label>
                                    <input type="text" class="form-control" required name="lastname">
                                </div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Email *</label>
                                <input type="email" class="form-control" required name="email">
                            </div>

                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Mot de passe *</label>
                                    <input type="password" class="form-control" required name="password">
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Confirmer le mot de passe *</label>
                                    <input type="password" class="form-control" required name="password_confirm">
                                </div>
                            </div>

                            <div id="studentFields">
                                <div class="row">
                                    <div class="col-md-6 mb-3">
                                        <label class="form-label">École/Université *</label>
                                        <input type="text" class="form-control" required name="school">
                                    </div>
                                    <div class="col-md-6 mb-3">
                                        <label class="form-label">Filière *</label>
                                        <input type="text" class="form-control" required name="field">
                                    </div>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">Niveau d'études *</label>
                                    <select class="form-control" required name="level">
                                        <option value="">Sélectionnez</option>
                                        <option>Bac+2</option>
                                        <option>Bac+3</option>
                                        <option>Bac+4</option>
                                        <option>Bac+5</option>
                                    </select>
                                </div>
                            </div>

                            <div id="companyFields" style="display: none;">
                                <div class="mb-3">
                                    <label class="form-label">Nom de l'entreprise *</label>
                                    <input type="text" class="form-control" name="company_name">
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">Secteur d'activité *</label>
                                    <input type="text" class="form-control" name="sector">
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">Ville *</label>
                                    <input type="text" class="form-control" name="city">
                                </div>
                            </div>

                            <div class="form-check mb-4">
                                <input class="form-check-input" type="checkbox" required id="terms">
                                <label class="form-check-label" for="terms">
                                    J'accepte les conditions d'utilisation
                                </label>
                            </div>

                            <button type="submit" class="btn btn-primary w-100 py-3">Créer mon compte</button>
                            
                            <div class="text-center mt-3">
                                <p>Déjà inscrit ? <a href="login.html">Connectez-vous</a></p>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <footer>
        <div class="container text-center">
            <p class="mb-0">© 2024 InternEasy</p>
        </div>
    </footer>

    <script>
        document.getElementById('typeStudent').addEventListener('click', function() {
            document.getElementById('typeStudent').classList.add('active');
            document.getElementById('typeCompany').classList.remove('active');
            document.getElementById('studentFields').style.display = 'block';
            document.getElementById('companyFields').style.display = 'none';
        });

        document.getElementById('typeCompany').addEventListener('click', function() {
            document.getElementById('typeCompany').classList.add('active');
            document.getElementById('typeStudent').classList.remove('active');
            document.getElementById('studentFields').style.display = 'none';
            document.getElementById('companyFields').style.display = 'block';
        });
    </script>
    <script src="js/main.js"></script>
</body>
</html>
