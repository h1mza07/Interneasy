<!DOCTYPE html>
<html lang="fr">
<head>
    <link rel="stylesheet" href="css/style.css">
    <meta charset="UTF-8">
    <title>InternEasy - Connexion</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow">
                    <div class="card-body p-5">
                        <h2 class="text-center mb-4">Connexion à InternEasy</h2>
                        
                        <!-- Choix du type d'utilisateur -->
                        <div class="d-flex mb-4">
                            <button class="btn btn-outline-primary flex-fill active" id="btnStudent">
                                🎓 Étudiant
                            </button>
                            <button class="btn btn-outline-primary flex-fill" id="btnCompany">
                                🏢 Entreprise
                            </button>
                        </div>
                        
                        <!-- Formulaire -->
                        <form id="loginForm">
                            <div class="mb-3">
                                <label class="form-label">Email</label>
                                <input type="email" class="form-control" placeholder="votre@email.com" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Mot de passe</label>
                                <input type="password" class="form-control" placeholder="Votre mot de passe" required>
                            </div>
                            <button type="submit" class="btn btn-primary w-100">Se connecter</button>
                        </form>
                        
                        <div class="text-center mt-3">
                            <a href="register.html">Créer un compte</a> | 
                            <a href="index.html">Retour à l'accueil</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="js/main.js"></script>
</body>
</html>
